<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Messenger — EECE/CS 3093C Lab 1</title>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<h1>Simple Messenger — EECE/CS 3093C Lab 2</h1>
<h3>By Hinna Parwez</h3>

<!-- Use-Case-03: Join Chat -->

<div id="loginUI">
  Username:
  <input
    id="username"
    type="text"
    autocomplete="username"
    placeholder="Username"
  />

  Password:
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Password"
  />

  <button id="join-button">Join Chat</button>
  
  <button id="show-register-button">
      Register Account
  </button>

  <p id="login-error"></p>

  </div>

<!-- Hidden until Register Account is clicked -->
<div id="registerUI" style="display: none;">

    <h2>Register Account</h2>

    Username:
    <input
        id="register-username"
        type="text"
        placeholder="Username"
    />

    <br><br>

    Password:
    <input
        id="register-password"
        type="password"
        placeholder="Password"
    />

    <br><br>

    <button id="register-button">
        Register
    </button>

    <button id="show-login-button">
        Back to Login
    </button>

    <p id="register-error"></p>

</div>


<!-- Hidden until login succeeds -->
<div id="chatUI" style="display: none;">

  <p>
    Logged in as:
    <strong id="logged-in-user"></strong>
    <button id="logout-button">Logout</button>
  </p>

  <p>
    Users list:
    <span id="user-list">[]</span>
  </p>

  Chat message:
  <input
    id="chat-message"
    type="text"
    autocomplete="off"
    placeholder="Type a message…"
    style="width:450px;"
  />

  <button id="send-button">Send</button>

  <br>

  <p><b>System status:</b></p>
  <div id="system-status"></div>

  <br>

  <p><b>Chat Responses:</b></p>
  <div id="chat-responses"></div>

</div>

<br>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"
  integrity="sha512-78KH17QLT5e55GJqP76vutp1D2iAoy06WcYBXB6iBCsmO6wWzx0Qdg8EDpm8mKXv68BcvHOyeeP4wxAL0twJGQ=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer">
</script>

<script src="client.js"></script>

</body>
</html>
